<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* NHS PREMIUM COLOR PALETTE */
        :root {
            --nhs-deep-blue: #003087;
            --nhs-primary-blue: #005EB8;
            --nhs-light-blue: #0072CE;
            --nhs-medical-white: #F0F4F8;
            --nhs-pure-white: #FFFFFF;
            --nhs-green: #009639;
            --nhs-green-light: #00B84A;
            --nhs-amber: #FAE100;
            --nhs-red: #DA291C;
            --nhs-dark-bg: #001E50;
            --nhs-dark-card: #002A5C;
            --nhs-gradient-primary: linear-gradient(135deg, #003087 0%, #005EB8 100%);
            --nhs-gradient-success: linear-gradient(135deg, #009639 0%, #00B84A 100%);
            --nhs-gradient-light: linear-gradient(135deg, #F0F4F8 0%, #FFFFFF 100%);
        }
        
        @keyframes pulse-urgent {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .pulse-urgent { animation: pulse-urgent 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        .animate-slideIn { animation: slideIn 0.3s ease-out; }
        .animate-scaleIn { animation: scaleIn 0.2s ease-out; }
        
        /* Premium Glass Effects with NHS Colors */
        .glass {
            background: rgba(240, 244, 248, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 94, 184, 0.1);
            box-shadow: 0 8px 32px rgba(0, 48, 135, 0.08);
        }
        
        .glass-dark {
            background: rgba(0, 42, 92, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 94, 184, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        /* Premium shadows with blue tint */
        .shadow-premium {
            box-shadow: 0 10px 25px -5px rgba(0, 48, 135, 0.15), 0 8px 10px -6px rgba(0, 94, 184, 0.1);
        }
        
        .shadow-premium-lg {
            box-shadow: 0 20px 50px -12px rgba(0, 48, 135, 0.2), 0 12px 20px -8px rgba(0, 94, 184, 0.15);
        }
        
        /* Hover effects */
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0, 48, 135, 0.2);
        }
        
        /* Progress ring */
        .progress-ring {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        /* Badge pulse */
        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .badge-pulse {
            animation: badge-pulse 2s ease-in-out infinite;
        }
        
        /* NHS Premium Gradients */
        .gradient-primary {
            background: var(--nhs-gradient-primary);
        }
        
        .gradient-success {
            background: var(--nhs-gradient-success);
        }
        
        .gradient-light {
            background: var(--nhs-gradient-light);
        }
        
        /* Message pattern with NHS blue */
        .message-pattern {
            background-color: #F0F4F8;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 10px, 
                rgba(0, 94, 184, 0.03) 10px, rgba(0, 94, 184, 0.03) 20px);
        }

            background-color: #001E50;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 10px, 
                rgba(0, 94, 184, 0.1) 10px, rgba(0, 94, 184, 0.1) 20px);
        }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* NHS Premium Color Classes */
        .bg-nhs-red { background-color: #DA291C !important; }
        .bg-nhs-amber { background-color: #FAE100 !important; }
        .bg-nhs-blue { background-color: #005EB8 !important; }
        .bg-nhs-deep-blue { background-color: #003087 !important; }
        .bg-nhs-green { background-color: #009639 !important; }
        .bg-nhs-medical-white { background-color: #F0F4F8 !important; }
        
        .text-nhs-red { color: #DA291C !important; }
        .text-nhs-amber { color: #FAE100 !important; }
        .text-nhs-blue { color: #005EB8 !important; }
        .text-nhs-deep-blue { color: #003087 !important; }
        .text-nhs-green { color: #009639 !important; }
        
        .border-nhs-red { border-color: #DA291C !important; }
        .border-nhs-amber { border-color: #FAE100 !important; }
        .border-nhs-blue { border-color: #005EB8 !important; }
        .border-nhs-deep-blue { border-color: #003087 !important; }
        .border-nhs-green { border-color: #009639 !important; }
        
        /* Status indicators with NHS colors */
        .status-online {
            width: 8px;
            height: 8px;
            background: #00B84A;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 3px rgba(0, 184, 74, 0.2);
            animation: pulse-online 2s ease-in-out infinite;

        @keyframes pulse-online {
            0%, 100% { box-shadow: 0 0 0 3px rgba(0, 184, 74, 0.2); }

        }
        
        /* Premium card styling */
        .premium-card {
            background: var(--nhs-gradient-light);

        /* Button gradients */
        .btn-primary {

        // ðŸ”’ WARNING BANNERS
        function ChatWarningBanner() {
            const [dismissed, setDismissed] = useState(localStorage.getItem('chat_warning_acknowledged') === 'true');
            
            const handleAcknowledge = () => {
                const acknowledgment = {
                    feature: 'messages_chat',
                    warning: 'GDPR - No patient information in messages',
                    acknowledgedAt: new Date().toISOString(),
                    userId: localStorage.getItem('current_user_id') || 'unknown',
                    ipDisclaimer: 'User acknowledged they will not discuss patient information'
                };
                
                // Save acknowledgment
                const acknowledgments = JSON.parse(localStorage.getItem('legal_acknowledgments') || '[]');
                acknowledgments.push(acknowledgment);
                localStorage.setItem('legal_acknowledgments', JSON.stringify(acknowledgments));
                localStorage.setItem('chat_warning_acknowledged', 'true');
                
                setDismissed(true);
            };
            
            if (dismissed) return null;
            
            return (
                <div className="bg-red-50 dark:bg-red-900/20 border-l-4 border-red-600 p-4 mb-4 rounded-lg animate-fadeIn">
                    <div className="flex items-start gap-3">
                        <span className="text-2xl">âš ï¸</span>
                        <div className="flex-1">
                            <h4 className="font-bold text-red-900 dark:text-red-300 mb-1">
                                GDPR WARNING - Do Not Discuss Patient Information
                            </h4>
                            <p className="text-sm text-red-800 dark:text-red-400 mb-3">
                                Never include patient names, phone numbers, addresses, or medical information. Use patient ID numbers only.
                            </p>
                            <button 
                                onClick={handleAcknowledge}
                                className="px-4 py-2 bg-red-700 hover:bg-red-800 text-white rounded-lg text-sm font-medium transition-colors"
                            >
                                I Understand
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ðŸ”’ LEGAL AUDIT TRAIL - Export for Court Evidence
        function exportLegalAcknowledgments() {
            const acknowledgments = JSON.parse(localStorage.getItem('legal_acknowledgments') || '[]');
            const privacyAccepted = localStorage.getItem('privacy_accepted');
            const privacyDate = localStorage.getItem('privacy_accepted_date');
            
            const report = {
                exportDate: new Date().toISOString(),
                privacyPolicy: {
                    accepted: privacyAccepted === 'true',
                    acceptedDate: privacyDate,
                    consents: [
                        'User acknowledged they will NOT store patient data',
                        'User consented to performance monitoring',
                        'User agreed to Terms of Use and Privacy Policy',
                        'User acknowledged they are responsible for their actions'
                    ]
                },
                warningAcknowledgments: acknowledgments,
                totalAcknowledgments: acknowledgments.length,
                legalNote: 'This report contains legally binding acknowledgments made by the user. All timestamps are in UTC.'
            };
            
            return report;
        }
        
        // Admin can download legal audit trail
        function downloadLegalAuditTrail() {
            const report = exportLegalAcknowledgments();
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `legal-audit-trail-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        // Storage utilities
        const Storage = {
            get: (key) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : null;
                } catch (e) {
                    console.error('Storage error:', e);
                    return null;
                }
            },
            set: (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                } catch (e) {
                    console.error('Storage error:', e);
                    return false;
                }
            },
            remove: (key) => {
                try {
                    localStorage.removeItem(key);
                    return true;
                } catch (e) {
                    return false;
                }
            }
        };

        // Helper: Get NHS color for priority
        const getNHSColor = (priority) => {
            const colors = {

            if (minutes < 60) return `${minutes}m ago`;

                        setError('An account with this email already exists.');

                        setLoading(false);

                    }

                    Storage.set('users', users);

            const chains = Storage.get('chains') || [];

            const initializeBranch = () => {
                return {
                    tasks: [],

                    messages: [],
                    announcements: [],

                };
            };

            const handleCreateChain = () => {
                if (!chainId || !chainName) {

                    setError('Chain ID already exists');
                    return;
                }
                chains.push({
                    id: chainId,
                    name: chainName,
                    corporateAdmins: [user.id],
                    createdAt: new Date().toISOString()

                Storage.set('chains', chains);
                setIsCreatingChain(false);
                setError('');
            };

            const handleCreateBranch = () => {
                if (!branchId || !branchName || !chainId) {
                    setError('Please fill all fields and select a chain');
                    return;
                }
                if (branches.find(b => b.id === branchId)) {
                    setError('Branch ID already exists');
                    return;
                }
                const newBranch = {
                    id: branchId,
                    name: branchName,
                    chainId: chainId,
                    admins: [user.id],
                    branchAdmin: user.id, // NEW: Branch creator is the branch admin
                    members: [{ userId: user.id, role: 'branch-admin', joinedAt: new Date().toISOString() }],
                    ...initializeBranch()
                };
                branches.push(newBranch);
                Storage.set('branches', branches);
                const updatedUser = { ...user, branchId, chainId, isAdmin: true, role: 'branch-admin' };
                Storage.set('rememberedUser', updatedUser);
                onComplete(updatedUser);
            };

            const handleJoinBranch = () => {
                if (!branchId || !role) {
                    setError('Please enter Branch ID and select your role');
                    return;
                }
                const branch = branches.find(b => b.id === branchId);
                if (!branch) {
                    setError('Branch not found');
                    return;
                }
                if (branch.members.find(m => m.userId === user.id)) {
                    setError('You are already a member of this branch');
                    return;
                }
                
                // Initialize pendingRequests if not exists
                if (!branch.pendingRequests) branch.pendingRequests = [];
                
                // Check if already has pending request
                if (branch.pendingRequests.find(r => r.userId === user.id)) {
                    setError('You already have a pending join request for this branch. Please wait for admin approval.');
                    return;
                }
                
                // Create join request instead of instant join
                branch.pendingRequests.push({
                    userId: user.id,
                    userName: user.name,
                    userEmail: user.email,
                    requestedRole: role,
                    requestedAt: new Date().toISOString()
                });
                
                Storage.set('branches', branches);
                setError('');
                setBranchId('');
                setRole('staff');

                                <option value="pharmacy-technician">Pharmacy Technician</option>

function ScheduleTab({ user, branch, isAdmin, darkMode, refresh }) {
    const [selectedWeek, setSelectedWeek] = useState(new Date());
    const [showAddShift, setShowAddShift] = useState(false);
    const [selectedStaff, setSelectedStaff] = useState('');
    const [selectedDay, setSelectedDay] = useState('');
    const [shiftStart, setShiftStart] = useState('09:00');
    const [shiftEnd, setShiftEnd] = useState('17:00');
    const [showQuickFill, setShowQuickFill] = useState(false);
    const [quickFillStaff, setQuickFillStaff] = useState('');

    const branches = Storage.get('branches') || [];
    const users = Storage.get('users') || [];
    const currentBranch = branches.find(b => b.id === branch.id);
    
    if (!currentBranch.schedule) {
        currentBranch.schedule = [];
    }

    const branchMembers = currentBranch?.members?.map(m => users.find(u => u.id === m.userId)).filter(Boolean) || [];
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    
    // Get week dates safely
    const getWeekDates = (startDate) => {
        const week = [];
        const baseDate = new Date(startDate.getTime());
        const dayOfWeek = baseDate.getDay();
        const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek; // Monday as first day
        
        baseDate.setDate(baseDate.getDate() + diff);
        
        for (let i = 0; i < 7; i++) {
            const currentDate = new Date(baseDate.getTime());
            currentDate.setDate(baseDate.getDate() + i);
            week.push(currentDate);
        }
        return week;
    };

    const weekDates = getWeekDates(selectedWeek);
    
    const getShiftsForDay = (date, userId) => {
        const dateStr = date.toISOString().split('T')[0];
        return currentBranch.schedule.filter(s => s.date === dateStr && s.userId === userId);
    };

    const handleAddShift = () => {
        if (!selectedStaff || !selectedDay) return;
        const dateStr = weekDates[days.indexOf(selectedDay)].toISOString().split('T')[0];
        currentBranch.schedule.push({
            id: Date.now().toString(),
            userId: selectedStaff,
            date: dateStr,
            start: shiftStart,
            end: shiftEnd,
            createdBy: user.id
        });
        Storage.set('branches', branches);
        setShowAddShift(false);
        setSelectedStaff('');
        setSelectedDay('');
        refresh();
    };

    const handleQuickFill = () => {
        if (!quickFillStaff) return;
        for (let i = 0; i < 5; i++) {
            const dateStr = weekDates[i].toISOString().split('T')[0];
            const exists = currentBranch.schedule.find(s => s.date === dateStr && s.userId === quickFillStaff);
            if (!exists) {
                currentBranch.schedule.push({
                    id: Date.now().toString() + i,
                    userId: quickFillStaff,
                    date: dateStr,
                    start: '09:00',
                    end: '17:00',
                    createdBy: user.id
                });
            }
        }
        Storage.set('branches', branches);
        setShowQuickFill(false);
        setQuickFillStaff('');
        refresh();
    };

    const handleDeleteShift = (shiftId) => {
        const index = currentBranch.schedule.findIndex(s => s.id === shiftId);
        if (index !== -1) {
            currentBranch.schedule.splice(index, 1);
            Storage.set('branches', branches);
            refresh();
        }
    };

    const changeWeek = (direction) => {
        const newDate = new Date(selectedWeek.getTime());
        newDate.setDate(newDate.getDate() + (direction * 7));
        setSelectedWeek(newDate);
    };

    return (
        <div className="p-4 max-w-7xl mx-auto animate-fadeIn">
            <div className="flex items-center justify-between mb-6">
                <h2 className="text-2xl font-bold text-gray-800 dark:text-white">Staff Schedule</h2>
                {isAdmin && (
                    <div className="flex gap-2">
                        <button onClick={() => setShowQuickFill(true)} className="btn-success px-4 py-2 rounded-lg text-white text-sm">
                            âš¡ Quick Fill Week
                        </button>
                        <button onClick={() => setShowAddShift(true)} className="btn-primary px-4 py-2 rounded-lg text-white text-sm">
                            + Add Shift
                        </button>
                    </div>
                )}
            </div>

            {/* Week Navigation */}
            <div className="flex items-center justify-center gap-4 mb-6 glass dark:glass-dark rounded-xl p-4 shadow-premium">
                <button onClick={() => changeWeek(-1)} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                    â† Previous Week
                </button>
                <div className="text-center">
                    <div className="text-lg font-bold text-gray-800 dark:text-white">
                        {weekDates[0].toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}
                    </div>
                    <div className="text-sm text-gray-600 dark:text-gray-400">
                        {weekDates[0].toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} - {weekDates[6].toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}
                    </div>
                </div>
                <button onClick={() => changeWeek(1)} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                    Next Week â†’
                </button>
            </div>

            {/* Beautiful Schedule Table */}
            <div className="glass dark:glass-dark rounded-2xl shadow-premium-lg overflow-hidden">
                <div className="gradient-primary text-white p-4">
                    <div className="grid grid-cols-8 gap-2">
                        <div className="font-bold text-sm">Staff</div>
                        {days.map((day, idx) => (
                            <div key={day} className="text-center">
                                <div className="font-bold text-sm">{day.substring(0, 3)}</div>
                                <div className="text-xs opacity-80">{weekDates[idx].getDate()}</div>
                            </div>
                        ))}
                    </div>
                </div>

                <div className="divide-y divide-gray-200 dark:divide-gray-700">
                    {branchMembers.map(member => (
                        <div key={member.id} className="grid grid-cols-8 gap-2 p-3 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                            <div className="flex items-center gap-2">
                                <img src={member.profilePicture} className="w-10 h-10 rounded-full ring-2 ring-white dark:ring-gray-700" alt="" />
                                <div>
                                    <div className="font-medium text-sm text-gray-800 dark:text-white">{member.name.split(' ')[0]}</div>
                                    <div className="text-xs text-gray-500 dark:text-gray-400 capitalize">{member.role?.replace('-', ' ')}</div>
                                </div>
                            </div>

                            {weekDates.map((date, idx) => {
                                const shifts = getShiftsForDay(date, member.id);
                                const isToday = date.toDateString() === new Date().toDateString();
                                return (
                                    <div key={idx} className={`flex flex-col gap-1 ${isToday ? 'bg-blue-50 dark:bg-blue-900/20 rounded-lg p-1' : ''}`}>
                                        {shifts.length === 0 ? (
                                            <div className="text-center text-xs text-gray-400 dark:text-gray-600 py-2">-</div>
                                        ) : (
                                            shifts.map(shift => (
                                                <div key={shift.id} className="group relative">
                                                    <div className="bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-lg p-2 text-xs font-medium shadow-md hover:shadow-lg transition-all">
                                                        <div className="flex items-center justify-between">
                                                            <span>{shift.start}</span>
                                                            {isAdmin && (
                                                                <button 
                                                                    onClick={() => handleDeleteShift(shift.id)}
                                                                    className="opacity-0 group-hover:opacity-100 text-white hover:text-red-200 transition-opacity"
                                                                >
                                                                    Ã—
                                                                </button>
                                                            )}
                                                        </div>
                                                        <div className="text-center text-xs opacity-75">-</div>
                                                        <div>{shift.end}</div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    ))}
                </div>
            </div>

            {/* Add Shift Modal */}
            {showAddShift && isAdmin && (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div className="glass dark:glass-dark rounded-2xl p-6 w-full max-w-md shadow-premium-lg">
                        <h3 className="text-xl font-bold mb-4 text-gray-800 dark:text-white">Add Shift</h3>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Staff Member</label>
                                <select value={selectedStaff} onChange={(e) => setSelectedStaff(e.target.value)} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                    <option value="">Select staff...</option>
                                    {branchMembers.map(m => (
                                        <option key={m.id} value={m.id}>{m.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Day</label>
                                <select value={selectedDay} onChange={(e) => setSelectedDay(e.target.value)} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                    <option value="">Select day...</option>
                                    {days.map(day => (
                                        <option key={day} value={day}>{day}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Start</label>
                                    <input type="time" value={shiftStart} onChange={(e) => setShiftStart(e.target.value)} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">End</label>
                                    <input type="time" value={shiftEnd} onChange={(e) => setShiftEnd(e.target.value)} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={handleAddShift} className="flex-1 btn-primary py-2 rounded-lg text-white">Add Shift</button>
                                <button onClick={() => setShowAddShift(false)} className="flex-1 bg-gray-300 dark:bg-gray-600 text-gray-800 dark:text-white py-2 rounded-lg">Cancel</button>
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {/* Quick Fill Modal */}
            {showQuickFill && isAdmin && (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div className="glass dark:glass-dark rounded-2xl p-6 w-full max-w-md shadow-premium-lg">
                        <h3 className="text-xl font-bold mb-4 text-gray-800 dark:text-white">âš¡ Quick Fill Week</h3>
                        <p className="text-sm text-gray-600 dark:text-gray-400 mb-4">Fill Monday to Friday (9am-5pm) for selected staff</p>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Staff Member</label>
                                <select value={quickFillStaff} onChange={(e) => setQuickFillStaff(e.target.value)} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white">

        function DispensaryTab({ user, branch, isAdmin, darkMode, refresh }) {
            const [showTemplates, setShowTemplates] = useState(false);
            const [showAssign, setShowAssign] = useState(false);
            const [selectedUser, setSelectedUser] = useState('');
            const [taskText, setTaskText] = useState('');
            const [taskPriority, setTaskPriority] = useState('normal');
            const [taskDueDate, setTaskDueDate] = useState('');
            const [reportText, setReportText] = useState('');
            const [showReport, setShowReport] = useState(null);
            const [selectedTemplate, setSelectedTemplate] = useState(null);

            const branches = Storage.get('branches') || [];
            const users = Storage.get('users') || [];
            const currentBranch = branches.find(b => b.id === branch.id);
            
            const allTasks = currentBranch?.tasks || [];
            const myTasks = allTasks.filter(t => t.assignedTo === user.id && !t.completedAt);
            const currentTask = myTasks[0];

            const canAssign = canAssignTasks(user.role);

            const handleAssignTask = () => {
                if (!selectedUser || !taskText) return;
                
                const newTask = {
                    id: Date.now().toString(),
                    assignedTo: selectedUser,
                    assignedBy: user.id,
                    text: taskText,
                    priority: taskPriority,
                    dueDate: taskDueDate,
                    createdAt: new Date().toISOString(),
                    completedAt: null,
                    reports: [],
                    isTemplate: false,
                    templateItems: null
                };

                currentBranch.tasks.push(newTask);
                Storage.set('branches', branches);
                setSelectedUser('');
                setTaskText('');
                setTaskPriority('normal');
                setTaskDueDate('');
                setShowAssign(false);
                refresh();
            };

            const handleAssignTemplate = (template) => {
                if (!selectedUser) {
                    alert('Please select a team member first');
                    return;
                }

                const newTask = {
                    id: Date.now().toString(),
                    assignedTo: selectedUser,
                    assignedBy: user.id,
                    text: template.name,
                    priority: template.priority,
                    createdAt: new Date().toISOString(),
                    completedAt: null,
                    reports: [],
                    isTemplate: true,
                    templateItems: template.items.map((item, idx) => ({
                        id: idx,
                        text: item,
                        checked: false
                    }))
                };

                currentBranch.tasks.push(newTask);
                Storage.set('branches', branches);
                setSelectedUser('');
                setShowTemplates(false);
                refresh();
            };

            const handleCheckItem = (taskId, itemId) => {
                const task = currentBranch.tasks.find(t => t.id === taskId);
                if (task && task.templateItems) {
                    const item = task.templateItems.find(i => i.id === itemId);
                    if (item) {
                        item.checked = !item.checked;
                        
                        // Check if all items are checked
                        const allChecked = task.templateItems.every(i => i.checked);
                        if (allChecked) {
                            task.completedAt = new Date().toISOString();
                        }
                        
                        Storage.set('branches', branches);
                        refresh();
                    }
                }
            };

            const handleCompleteTask = (taskId) => {
                const task = currentBranch.tasks.find(t => t.id === taskId);
                if (task) {
                    // Show completion animation
                    const taskElement = document.querySelector(`[data-task-id="${taskId}"]`);
                    if (taskElement) {
                        taskElement.style.animation = 'pulse 0.5s ease-in-out';
                    }
                    
                    setTimeout(() => {
                        task.completedAt = new Date().toISOString();
                        Storage.set('branches', branches);
                        refresh();
                    }, 500);
                }
            };

            const handleSendReport = (taskId) => {
                if (!reportText) return;
                const task = currentBranch.tasks.find(t => t.id === taskId);
                if (task) {
                    task.reports.push({
                        text: reportText,
                        sentAt: new Date().toISOString(),
                        sentBy: user.id
                    });
                    Storage.set('branches', branches);
                    setReportText('');
                    setShowReport(null);
                    refresh();
                }
            };

            const getTimeRemaining = (dueDate) => {
                if (!dueDate) return null;
                const now = new Date();
                const due = new Date(dueDate);
                const diff = due - now;
                
                if (diff < 0) return { text: 'Overdue', color: 'text-nhs-red' };
                
                const hours = Math.floor(diff / (1000 * 60 * 60));
                if (hours < 24) return { text: `${hours}h left`, color: 'text-orange-600' };
                
                const days = Math.floor(hours / 24);
                return { text: `${days}d left`, color: 'text-nhs-green' };
            };

            // User View
            if (!canAssign) {
                return (
                    <div className="p-4 max-w-2xl mx-auto">
                        <h2 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">My Current Task</h2>
                        
                        {currentTask ? (
                            <div 
                                data-task-id={currentTask.id}
                                className={`p-6 rounded-lg border-2 ${getNHSColor(currentTask.priority).bg} ${getNHSColor(currentTask.priority).border} transition-all`}
                            >
                                <div className="flex items-center justify-between mb-3">
                                    <span className={`text-xs font-semibold uppercase ${getNHSColor(currentTask.priority).text}`}>
                                        {currentTask.priority} Priority
                                    </span>
                                    {currentTask.dueDate && (
                                        <span className={`text-sm font-medium ${getTimeRemaining(currentTask.dueDate)?.color}`}>
                                            {getTimeRemaining(currentTask.dueDate)?.text}
                                        </span>
                                    )}
                                </div>
                                
                                <p className="text-lg mb-4 text-gray-800 dark:text-white font-semibold">{currentTask.text}</p>
                                
                                {currentTask.isTemplate && currentTask.templateItems && (
                                    <div className="space-y-2 mb-4">
                                        {currentTask.templateItems.map(item => (
                                            <div 
                                                key={item.id} 
                                                onClick={() => handleCheckItem(currentTask.id, item.id)}
                                                className="flex items-center gap-3 p-3 bg-white dark:bg-gray-800 rounded cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-750"
                                            >
                                                <input
                                                    type="checkbox"
                                                    checked={item.checked}
                                                    onChange={(e) => {
                                                        e.stopPropagation();
                                                        handleCheckItem(currentTask.id, item.id);
                                                    }}
                                                    className="w-5 h-5 cursor-pointer"
                                                    style={{ accentColor: '#005EB8' }}
                                                />
                                                <span className={`flex-1 ${item.checked ? 'line-through text-gray-500' : 'text-gray-800 dark:text-white'}`}>
                                                    {item.text}
                                                </span>
                                            </div>
                                        ))}
                                        <div className="mt-3 text-sm text-gray-600 dark:text-gray-400">
                                            Progress: {currentTask.templateItems.filter(i => i.checked).length}/{currentTask.templateItems.length} completed

                            </div>

                    </div>

        // ============= HANDOVER TAB =============
        function HandoverTab({ user, branch, isAdmin, darkMode, refresh }) {
            const [showCreate, setShowCreate] = useState(false);
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [priority, setPriority] = useState('info');
            const [comment, setComment] = useState('');
            const [showComments, setShowComments] = useState(null);

            const branches = Storage.get('branches') || [];
            const users = Storage.get('users') || [];
            const currentBranch = branches.find(b => b.id === branch.id);
            const handoverNotes = currentBranch?.handoverNotes || [];

            const canCreate = canAssignTasks(user.role) || isAdmin;

            const sortedNotes = [...handoverNotes].sort((a, b) => {
                const priorityOrder = { urgent: 0, attention: 1, info: 2 };
                if (a.read && !b.read) return 1;
                if (!a.read && b.read) return -1;
                return priorityOrder[a.priority] - priorityOrder[b.priority];
            });

            const handleCreate = () => {
                if (!title || !content) return;

                const newNote = {
                    id: Date.now().toString(),
                    title,
                    content,
                    priority,
                    createdBy: user.id,
                    createdAt: new Date().toISOString(),
                    read: false,
                    comments: []
                };

                currentBranch.handoverNotes.push(newNote);
                Storage.set('branches', branches);
                setTitle('');
                setContent('');
                setPriority('info');
                setShowCreate(false);
                refresh();
            };

            const handleMarkRead = (noteId) => {
                const note = currentBranch.handoverNotes.find(n => n.id === noteId);
                if (note) {
                    note.read = true;
                    Storage.set('branches', branches);
                    refresh();
                }
            };

            const handleCompleteHandover = (noteId) => {
                const noteIndex = currentBranch.handoverNotes.findIndex(n => n.id === noteId);
                if (noteIndex !== -1) {
                    currentBranch.handoverNotes.splice(noteIndex, 1);
                    Storage.set('branches', branches);
                    refresh();
                }
            };

            const handleAddComment = (noteId) => {
                if (!comment) return;
                const note = currentBranch.handoverNotes.find(n => n.id === noteId);
                if (note) {
                    note.comments.push({
                        text: comment,
                        userId: user.id,
                        createdAt: new Date().toISOString()
                    });
                    Storage.set('branches', branches);
                    setComment('');
                    setShowComments(null);
                    refresh();
                }
            };

            const getPriorityIcon = (priority) => {
                const icons = {
                    urgent: { icon: 'ðŸ”´', label: 'URGENT', color: 'bg-red-100 dark:bg-red-900/30 border-nhs-red' },
                    attention: { icon: 'ðŸŸ¡', label: 'ATTENTION', color: 'bg-yellow-100 dark:bg-yellow-900/30 border-nhs-amber' },
                    info: { icon: 'ðŸ”µ', label: 'INFO', color: 'bg-blue-100 dark:bg-blue-900/30 border-nhs-blue' }
                };
                return icons[priority] || icons.info;
            };

            return (
                <div className="p-4 max-w-2xl mx-auto">
                    <HandoverWarningBanner />
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-2xl font-bold text-gray-800 dark:text-white">Shift Handover</h2>
                        {canCreate && (
                            <button onClick={() => setShowCreate(true)} className="btn-primary text-white px-4 py-2 rounded-lg">
                                + Add Note
                            </button>
                        )}
                    </div>

                    {showCreate && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md">
                                <h3 className="text-xl font-bold mb-4 text-gray-800 dark:text-white">Create Handover Note</h3>
                                <div className="space-y-4">
                                    <select value={priority} onChange={(e) => setPriority(e.target.value)} className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                        <option value="urgent">ðŸ”´ Urgent</option>
                                        <option value="attention">ðŸŸ¡ Attention Needed</option>
                                        <option value="info">ðŸ”µ Information</option>
                                    </select>
                                    <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Title" className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
                                    <textarea value={content} onChange={(e) => setContent(e.target.value)} placeholder="Handover note details..." className="w-full px-4 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white" rows={6} />
                                    <div className="flex gap-2">
                                        <button onClick={handleCreate} className="flex-1 btn-primary text-white py-2 rounded-lg">
                                            Post Note
                                        </button>
                                        <button onClick={() => setShowCreate(false)} className="flex-1 bg-gray-300 dark:bg-gray-600 text-gray-800 dark:text-white py-2 rounded-lg">
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="space-y-4">
                        {sortedNotes.length === 0 ? (
                            <p className="text-center py-12 text-gray-500 dark:text-gray-400">No handover notes yet</p>
                        ) : (
                            sortedNotes.map(note => {
                                const author = users.find(u => u.id === note.createdBy);
                                const priorityInfo = getPriorityIcon(note.priority);
                                return (
                                    <div key={note.id} className={`p-4 rounded-lg border-2 ${priorityInfo.color} ${note.read ? 'opacity-60' : ''}`}>
                                        <div className="flex items-start justify-between mb-2">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span>{priorityInfo.icon}</span>
                                                    <span className="font-semibold text-sm">{priorityInfo.label}</span>
                                                    {!note.read && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded">NEW</span>}
                                                </div>
                                                <h3 className="font-bold text-gray-800 dark:text-white">{note.title}</h3>
                                                <div className="text-xs text-gray-500 dark:text-gray-400 mt-1">
                                                    {author?.name} â€¢ {getTimeAgo(note.createdAt)}
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                {!note.read && (
                                                    <button onClick={() => handleMarkRead(note.id)} className="text-sm btn-success text-white px-3 py-1 rounded">
                                                        Mark Read
                                                    </button>
                                                )}
                                                <button onClick={() => handleCompleteHandover(note.id)} className="text-sm btn-primary text-white px-3 py-1 rounded">
                                                    âœ“ Complete
                                                </button>
                                            </div>
                                        </div>
                                        <p className="text-gray-700 dark:text-gray-300 whitespace-pre-wrap mb-3">{note.content}</p>
                                        
                                        {note.comments && note.comments.length > 0 && (
                                            <div className="mt-3 pt-3 border-t border-gray-300 dark:border-gray-600">
                                                <div className="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">ðŸ’¬ Comments ({note.comments.length})</div>
                                                {note.comments.map((c, idx) => {
                                                    const commenter = users.find(u => u.id === c.userId);
                                                    return (
                                                        <div key={idx} className="text-sm text-gray-600 dark:text-gray-400 mb-2">
                                                            <span className="font-semibold">{commenter?.name}:</span> {c.text}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        {showComments === note.id ? (
                                            <div className="mt-3 flex gap-2">
                                                <input
                                                    type="text"
                                                    value={comment}
                                                    onChange={(e) => setComment(e.target.value)}
                                                    placeholder="Add comment..."
                                                    className="flex-1 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white text-sm"
                                                />
                                                <button onClick={() => handleAddComment(note.id)} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">
                                                    Send
                                                </button>
                                                <button onClick={() => setShowComments(null)} className="bg-gray-300 dark:bg-gray-600 text-gray-800 dark:text-white px-4 py-2 rounded-lg text-sm">
                                                    Cancel
                                                </button>
                                            </div>
                                        ) : (
                                            <button onClick={() => setShowComments(note.id)} className="mt-2 text-sm text-blue-600 dark:text-blue-400 hover:underline">
                                                + Add Comment
                                            </button>
                                        )}
                                    </div>
                                );
                            })
                        )}
                    </div>
                </div>
            );
        }

            const currentBranch = branches.find(b => b.id === branch.id);
            
            // Initialize announcements if not exists
            if (!currentBranch.announcements) {
                currentBranch.announcements = [];
                Storage.set('branches', branches);
            }
            
            const announcements = currentBranch.announcements || [];

            const handleCreate = () => {
                if (!title.trim() || !content.trim()) {
                    alert('âŒ Please enter both title and content');
                    return;
                }
                
                currentBranch.announcements.unshift({
                    id: Date.now().toString(),
                    title: title.trim(),
                    content: content.trim(),
                    createdBy: user.id,
                    createdAt: new Date().toISOString(),
                    pinned: false
                });
                
                Storage.set('branches', branches);
                setTitle('');
                setContent('');
                setShowCreate(false);
                refresh();
            };

            const handleDelete = (id) => {
                if (confirm('Delete this announcement?')) {
                    const index = currentBranch.announcements.findIndex(a => a.id === id);
                    if (index !== -1) {
                        currentBranch.announcements.splice(index, 1);
                        Storage.set('branches', branches);
                        refresh();
                    }
                }
            };

            const handlePin = (id) => {
                const announcement = currentBranch.announcements.find(a => a.id === id);
                if (announcement) {
                    announcement.pinned = !announcement.pinned;
                    Storage.set('branches', branches);
                    refresh();
                }
            };

            const sortedAnnouncements = [...announcements].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            const getTimeAgo = (dateString) => {
                const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
                if (seconds < 60) return 'Just now';
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60) return `${minutes}m ago`;
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return `${hours}h ago`;
                const days = Math.floor(hours / 24);
                return `${days} day${days > 1 ? 's' : ''} ago`;

        function InsightsTab({ user, branch, isAdmin, darkMode }) {
            if (!canViewAnalytics(user.role, isAdmin)) {
                return (
                    <div className="p-4 text-center">
                        <p className="text-gray-500 dark:text-gray-400">Only pharmacists and admins can view analytics</p>
                    </div>
                );
            }

            const branches = Storage.get('branches') || [];
            const users = Storage.get('users') || [];
            const currentBranch = branches.find(b => b.id === branch.id);
            const allTasks = currentBranch?.tasks || [];

            const getStaffAnalytics = () => {
                return currentBranch?.members.map(member => {
                    const memberUser = users.find(u => u.id === member.userId);
                    const memberTasks = allTasks.filter(t => t.assignedTo === member.userId);
                    const completedTasks = memberTasks.filter(t => t.completedAt);

                    const tasksByPriority = {
                        urgent: memberTasks.filter(t => t.priority === 'urgent').length,
                        high: memberTasks.filter(t => t.priority === 'high').length,
                        normal: memberTasks.filter(t => t.priority === 'normal').length,
                        low: memberTasks.filter(t => t.priority === 'low').length,
                    };

                    // Detect bottlenecks
                    const activeTasks = memberTasks.filter(t => !t.completedAt).length;
                    const hasBottleneck = activeTasks > 5;

                    return {
                        userId: member.userId,
                        name: memberUser?.name,
                        role: member.role,
                        profilePicture: memberUser?.profilePicture,
                        totalTasks: memberTasks.length,
                        completedTasks: completedTasks.length,
                        activeTasks,
                        tasksByPriority,
                        hasBottleneck,
                        completionRate: memberTasks.length > 0 ? Math.round((completedTasks.length / memberTasks.length) * 100) : 0
                    };
                });
            };

            const staffAnalytics = getStaffAnalytics();

            // Calculate peak times
            const getPeakTimes = () => {
                const hourCounts = new Array(24).fill(0);
                allTasks.forEach(task => {
                    const hour = new Date(task.createdAt).getHours();
                    hourCounts[hour]++;
                });
                const maxCount = Math.max(...hourCounts);
                return hourCounts.map((count, hour) => ({
                    hour,
                    count,
                    percentage: maxCount > 0 ? (count / maxCount) * 100 : 0
                }));
            };

            const peakTimes = getPeakTimes();
            const topPeakHours = peakTimes.filter(p => p.count > 0).sort((a, b) => b.count - a.count).slice(0, 5);

            return (
                <div className="p-4 max-w-4xl mx-auto pb-24">
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-2xl font-bold text-gray-800 dark:text-white">Analytics & Insights</h2>
                        {isAdmin && (
                            <button
                                onClick={() => {
                                    if (confirm('ðŸ“Š Clear Analytics Data?\n\nThis will:\nâ€¢ Delete all task history\nâ€¢ Clear analytics data\nâ€¢ Email summary to branch creator\nâ€¢ Start fresh analytics\n\nThis action cannot be undone.')) {
                                        // Prepare data export
                                        const exportData = {
                                            tasks: currentBranch.tasks || [],
                                            members: currentBranch.members || [],
                                            exportedAt: new Date().toISOString(),
                                            branchId: branch.id,
                                            branchName: branch.name,
                                            exportedBy: user.name
                                        };
                                        
                                        const dataString = JSON.stringify(exportData, null, 2);
                                        
                                        // Get branch creator email
                                        const creatorUser = users.find(u => u.id === currentBranch.createdBy);
                                        const creatorEmail = creatorUser?.email || '';
                                        
                                        // Open mailto to creator (new tab so page doesn't navigate away)
                                        if (creatorEmail) {
                                            const subject = encodeURIComponent(`Analytics Export - ${branch.name}`);
                                            const body = encodeURIComponent(`Analytics data exported on ${new Date().toLocaleString()}\n\nBranch: ${branch.name}\nExported by: ${user.name}\n\nData summary:\n- Total tasks: ${exportData.tasks.length}\n- Team members: ${exportData.members.length}\n\nFull data has been copied to your clipboard.`);
                                            
                                            // Use window.open instead of window.location.href to avoid navigation
                                            window.open(`mailto:${creatorEmail}?subject=${subject}&body=${body}`, '_blank');
                                        }
                                        
                                        // Copy data to clipboard
                                        navigator.clipboard.writeText(dataString).catch(() => {
                                            console.log('Could not copy to clipboard');
                                        });
                                        
                                        // Clear ONLY tasks (insights data) - NOT everything!
                                        currentBranch.tasks = [];
                                        Storage.set('branches', branches);
                                        
                                        // Show success and refresh component (NO page reload!)
                                        alert('âœ… Analytics data cleared!\n\nâ€¢ Data emailed to branch creator\nâ€¢ Data copied to clipboard\nâ€¢ Fresh analytics started');
                                        
                                        // Refresh the component to show empty state
                                        refresh();
                                    }
                                }}
                                className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium transition-colors"
                            >
                                ðŸ—‘ï¸ Clear All Data
                            </button>
                        )}
                    </div>

                    {/* Bottleneck Alerts */}
                    <div className="mb-6">
                        {staffAnalytics.filter(s => s.hasBottleneck).length > 0 && (
                            <div className="bg-red-50 dark:bg-red-900/20 border border-red-300 dark:border-red-700 rounded-lg p-4">
                                <h3 className="font-semibold text-red-800 dark:text-red-400 mb-2">âš ï¸ Bottleneck Alerts</h3>
                                {staffAnalytics.filter(s => s.hasBottleneck).map(staff => (
                                    <div key={staff.userId} className="text-sm text-red-700 dark:text-red-300">
                                        â€¢ {staff.name}: {staff.activeTasks} pending tasks (needs attention)
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Peak Times */}
                    <div className="bg-white dark:bg-gray-800 rounded-lg p-6 mb-6 shadow">
                        <h3 className="font-semibold text-gray-800 dark:text-white mb-4">Peak Task Times</h3>
                        <div className="space-y-2">
                            {topPeakHours.map(peak => (
                                <div key={peak.hour} className="flex items-center gap-3">
                                    <div className="w-16 text-sm text-gray-600 dark:text-gray-400">
                                        {peak.hour}:00
                                    </div>
                                    <div className="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-6 overflow-hidden">
                                        <div className="bg-nhs-blue h-full flex items-center px-2" style={{ width: `${peak.percentage}%` }}>
                                            <span className="text-xs text-white font-semibold">{peak.count} tasks</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Staff Performance */}
                    <div className="space-y-6">

                                    </div>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                    <div className="bg-blue-50 dark:bg-blue-900/20 p-3 rounded-lg">
                                        <div className="text-2xl font-bold text-nhs-blue">{staff.totalTasks}</div>
                                        <div className="text-xs text-blue-700 dark:text-blue-300">Total Tasks</div>

                                    <div className="bg-green-50 dark:bg-green-900/20 p-3 rounded-lg">
                                        <div className="text-2xl font-bold text-nhs-green">{staff.completedTasks}</div>
                                        <div className="text-xs text-green-700 dark:text-green-300">Completed</div>
                                    </div>
                                    <div className="bg-orange-50 dark:bg-orange-900/20 p-3 rounded-lg">

                                        <div className="text-xs text-purple-700 dark:text-purple-300">Completion</div>
                                    </div>

                                <div>
                                    <div className="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Tasks by Priority</div>
