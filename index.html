        function StaffTab({ user, branch, isAdmin, darkMode, refresh }) {
            const [showSettings, setShowSettings] = useState(false);
            const [showApproval, setShowApproval] = useState(false);
            const [showPhotoOptions, setShowPhotoOptions] = useState(false);
            const fileInputRef = useRef(null);
            const cameraInputRef = useRef(null);
            
            // Settings state
            const [displayName, setDisplayName] = useState(user.name);
            const [selectedAvatar, setSelectedAvatar] = useState(user.profilePicture);
            const [fontSize, setFontSize] = useState(localStorage.getItem('fontSize') || 'medium');
            const [colorTheme, setColorTheme] = useState(localStorage.getItem('colorTheme') || 'blue');
            const [compactMode, setCompactMode] = useState(localStorage.getItem('compactMode') === 'true');
            const [notifTasks, setNotifTasks] = useState(localStorage.getItem('notif_tasks') !== 'false');
            const [notifMessages, setNotifMessages] = useState(localStorage.getItem('notif_messages') !== 'false');
            const [notifHandovers, setNotifHandovers] = useState(localStorage.getItem('notif_handovers') !== 'false');

            const branches = Storage.get('branches') || [];
            const users = Storage.get('users') || [];
            const currentBranch = branches.find(b => b.id === branch.id);
            const pendingRequests = currentBranch?.pendingRequests || [];

            // Handle photo upload
            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                // Check file size (max 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('❌ Photo too large! Please choose a photo under 5MB.');
                    return;
                }

                // Check file type
                if (!file.type.startsWith('image/')) {
                    alert('❌ Please select an image file (JPG, PNG, etc.)');
                    return;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    setSelectedAvatar(event.target.result);
                    setShowPhotoOptions(false);
                };
                reader.readAsDataURL(file);
            };

            // Apply font size
            useEffect(() => {
                const sizes = { small: '14px', medium: '16px', large: '18px' };
                document.documentElement.style.fontSize = sizes[fontSize];
            }, [fontSize]);

            // Apply color theme
            useEffect(() => {
                const themes = {
                    blue: { primary: '#005EB8', secondary: '#003087', accent: '#0072CE' },
                    emerald: { primary: '#059669', secondary: '#047857', accent: '#10B981' },
                    purple: { primary: '#7C3AED', secondary: '#6D28D9', accent: '#8B5CF6' },
                    orange: { primary: '#EA580C', secondary: '#C2410C', accent: '#F97316' }
                };
                const theme = themes[colorTheme];
                document.documentElement.style.setProperty('--nhs-primary-blue', theme.primary);
                document.documentElement.style.setProperty('--nhs-deep-blue', theme.secondary);
                document.documentElement.style.setProperty('--nhs-light-blue', theme.accent);
            }, [colorTheme]);

            // Apply compact mode
            useEffect(() => {
                document.body.classList.toggle('compact-mode', compactMode);
            }, [compactMode]);

            const handleSaveSettings = () => {
                // Update user
                const allUsers = Storage.get('users') || [];
                const userIndex = allUsers.findIndex(u => u.id === user.id);
                if (userIndex !== -1) {
                    allUsers[userIndex].name = displayName;
                    allUsers[userIndex].profilePicture = selectedAvatar;
                    Storage.set('users', allUsers);
                }

                // Save settings
                localStorage.setItem('fontSize', fontSize);
                localStorage.setItem('colorTheme', colorTheme);
                localStorage.setItem('compactMode', compactMode);
                localStorage.setItem('notif_tasks', notifTasks);
                localStorage.setItem('notif_messages', notifMessages);
                localStorage.setItem('notif_handovers', notifHandovers);

                // Update remembered user
                const rememberedUser = Storage.get('rememberedUser');
                if (rememberedUser && rememberedUser.id === user.id) {
                    rememberedUser.name = displayName;
                    rememberedUser.profilePicture = selectedAvatar;
                    Storage.set('rememberedUser', rememberedUser);
                }

                alert('✅ Settings saved!');
                setShowSettings(false);
                window.location.reload();
            };

            const handleApprove = (requestUserId) => {
                const request = pendingRequests.find(r => r.userId === requestUserId);
                if (!request) return;

                currentBranch.members.push({
                    userId: requestUserId,
                    role: request.requestedRole,
                    joinedAt: new Date().toISOString()
                });

                const reqIndex = currentBranch.pendingRequests.findIndex(r => r.userId === requestUserId);
                if (reqIndex !== -1) {
                    currentBranch.pendingRequests.splice(reqIndex, 1);
                }

                Storage.set('branches', branches);
                refresh();
            };

            const handleReject = (requestUserId) => {
                const reqIndex = currentBranch.pendingRequests.findIndex(r => r.userId === requestUserId);
                if (reqIndex !== -1) {
                    currentBranch.pendingRequests.splice(reqIndex, 1);
                    Storage.set('branches', branches);
                    refresh();
                }
            };

            const handleRemoveMember = (memberId) => {
                if (confirm('Remove this team member?')) {
                    const memberIndex = currentBranch.members.findIndex(m => m.userId === memberId);
                    if (memberIndex !== -1) {
                        currentBranch.members.splice(memberIndex, 1);
                        Storage.set('branches', branches);
                        refresh();
                    }
                }
            };

            if (showSettings) {
                return (
                    <div className="p-4 max-w-2xl mx-auto pb-24">
                        <div className="flex items-center gap-3 mb-6">
                            <button onClick={() => setShowSettings(false)} className="text-2xl">←</button>
                            <h2 className="text-2xl font-bold text-gray-800 dark:text-white">Settings</h2>
                        </div>

                        {/* Hidden file inputs */}
                        <input
                            ref={fileInputRef}
                            type="file"
                            accept="image/*"
                            onChange={handlePhotoUpload}
                            style={{ display: 'none' }}
                        />
                        <input
                            ref={cameraInputRef}
                            type="file"
                            accept="image/*"
                            capture="environment"
                            onChange={handlePhotoUpload}
                            style={{ display: 'none' }}
                        />

                        {/* Photo Options Modal */}
                        {showPhotoOptions && (
                            <div className="fixed inset-0 bg-black/60 flex items-end justify-center z-50 p-0" onClick={() => setShowPhotoOptions(false)}>
                                <div 
                                    className="bg-white dark:bg-gray-800 rounded-t-3xl w-full max-w-md shadow-2xl animate-slideIn" 
                                    onClick={(e) => e.stopPropagation()}
                                    style={{ animation: 'slideUp 0.3s ease-out' }}
                                >
                                    <div className="p-6">
                                        <div className="w-12 h-1 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mb-6"></div>
                                        <h3 className="text-xl font-bold text-gray-800 dark:text-white mb-4 text-center">Change Profile Picture</h3>
                                        
                                        <div className="space-y-3">
                                            {/* Choose from Camera Roll */}
                                            <button
                                                onClick={() => fileInputRef.current?.click()}
                                                className="w-full bg-blue-50 dark:bg-blue-900/20 hover:bg-blue-100 dark:hover:bg-blue-900/30 text-blue-600 dark:text-blue-400 py-4 rounded-xl font-medium transition-all flex items-center justify-center gap-3"
                                            >
                                                <span className="text-2xl">🖼️</span>
                                                <span>Choose from Photo Library</span>
                                            </button>

                                            {/* Take Photo */}
                                            <button
                                                onClick={() => cameraInputRef.current?.click()}
                                                className="w-full bg-green-50 dark:bg-green-900/20 hover:bg-green-100 dark:hover:bg-green-900/30 text-green-600 dark:text-green-400 py-4 rounded-xl font-medium transition-all flex items-center justify-center gap-3"
                                            >
                                                <span className="text-2xl">📸</span>
                                                <span>Open Camera</span>
                                            </button>

                                            {/* Choose from Files */}
                                            <button
                                                onClick={() => fileInputRef.current?.click()}
                                                className="w-full bg-purple-50 dark:bg-purple-900/20 hover:bg-purple-100 dark:hover:bg-purple-900/30 text-purple-600 dark:text-purple-400 py-4 rounded-xl font-medium transition-all flex items-center justify-center gap-3"
                                            >
                                                <span className="text-2xl">📁</span>
                                                <span>Choose from Files</span>
                                            </button>

                                            {/* Cancel */}
                                            <button
                                                onClick={() => setShowPhotoOptions(false)}
                                                className="w-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-white py-4 rounded-xl font-medium transition-all"
                                            >
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="space-y-6">
                            {/* Personal Section */}
                            <div className="glass dark:glass-dark rounded-2xl p-6 shadow-premium">
                                <h3 className="text-lg font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2">
                                    <span>👤</span> Personal
                                </h3>
                                
                                {/* Profile Picture */}
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Profile Picture</label>
                                    <div className="flex flex-col items-center gap-4">
                                        <div className="relative">
                                            <img 
                                                src={selectedAvatar} 
                                                alt="Profile" 
                                                className="w-32 h-32 rounded-full ring-4 ring-blue-100 dark:ring-blue-900 object-cover"
                                            />
                                            <button
                                                onClick={() => setShowPhotoOptions(true)}
                                                className="absolute bottom-0 right-0 bg-nhs-blue hover:bg-blue-700 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg transition-all"
                                                title="Change photo"
                                            >
                                                <span className="text-xl">📷</span>
                                            </button>
                                        </div>
                                        <button
                                            onClick={() => setShowPhotoOptions(true)}
                                            className="bg-nhs-blue hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors"
                                        >
                                            Change Photo
                                        </button>
                                    </div>
                                </div>

                                {/* Display Name */}
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Display Name</label>
                                    <input
                                        type="text"
                                        value={displayName}
                                        onChange={(e) => setDisplayName(e.target.value)}
                                        className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-800 dark:text-white"
                                    />
                                </div>

                                {/* Email (read-only) */}
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
                                    <input
                                        type="email"
                                        value={user.email}
                                        disabled
                                        className="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400"
                                    />
                                    <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">Email cannot be changed</p>
                                </div>
                            </div>

                            {/* Appearance Section */}
                            <div className="glass dark:glass-dark rounded-2xl p-6 shadow-premium">
                                <h3 className="text-lg font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2">
                                    <span>🎨</span> Appearance
                                </h3>

                                {/* Font Size */}
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Font Size</label>
                                    <div className="flex gap-2">
                                        {['small', 'medium', 'large'].map(size => (
                                            <button
                                                key={size}
                                                onClick={() => setFontSize(size)}
                                                className={`flex-1 py-2 rounded-lg font-medium transition-all ${fontSize === size ? 'bg-nhs-blue text-white' : 'bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}`}
                                            >
                                                {size.charAt(0).toUpperCase() + size.slice(1)}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Color Theme */}
                                <div className="mb-4">
                                    <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Color Theme</label>
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            onClick={() => setColorTheme('blue')}
                                            className={`p-4 rounded-xl border-2 transition-all ${colorTheme === 'blue' ? 'border-blue-600 ring-4 ring-blue-200 dark:ring-blue-900' : 'border-gray-300 dark:border-gray-600'}`}
                                        >
                                            <div className="w-8 h-8 rounded-full bg-gradient-to-br from-blue-600 to-blue-800 mx-auto mb-2"></div>
                                            <div className="text-sm font-medium text-gray-800 dark:text-white">Ocean Blue</div>
                                        </button>
                                        <button
                                            onClick={() => setColorTheme('emerald')}
                                            className={`p-4 rounded-xl border-2 transition-all ${colorTheme === 'emerald' ? 'border-emerald-600 ring-4 ring-emerald-200 dark:ring-emerald-900' : 'border-gray-300 dark:border-gray-600'}`}
                                        >
                                            <div className="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-600 to-emerald-800 mx-auto mb-2"></div>
                                            <div className="text-sm font-medium text-gray-800 dark:text-white">Emerald</div>
                                        </button>
                                        <button
                                            onClick={() => setColorTheme('purple')}
                                            className={`p-4 rounded-xl border-2 transition-all ${colorTheme === 'purple' ? 'border-purple-600 ring-4 ring-purple-200 dark:ring-purple-900' : 'border-gray-300 dark:border-gray-600'}`}
                                        >
                                            <div className="w-8 h-8 rounded-full bg-gradient-to-br from-purple-600 to-purple-800 mx-auto mb-2"></div>
                                            <div className="text-sm font-medium text-gray-800 dark:text-white">Purple</div>
                                        </button>
                                        <button
                                            onClick={() => setColorTheme('orange')}
                                            className={`p-4 rounded-xl border-2 transition-all ${colorTheme === 'orange' ? 'border-orange-600 ring-4 ring-orange-200 dark:ring-orange-900' : 'border-gray-300 dark:border-gray-600'}`}
                                        >
                                            <div className="w-8 h-8 rounded-full bg-gradient-to-br from-orange-600 to-orange-800 mx-auto mb-2"></div>
                                            <div className="text-sm font-medium text-gray-800 dark:text-white">Orange</div>
                                        </button>
                                    </div>
                                </div>

                                {/* Compact Mode */}
                                <div>
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <div className="text-sm font-medium text-gray-700 dark:text-gray-300">Compact Mode</div>
                                            <div className="text-xs text-gray-500 dark:text-gray-400">Reduce spacing for more content</div>
                                        </div>
                                        <button
                                            onClick={() => setCompactMode(!compactMode)}
                                            className={`relative w-14 h-8 rounded-full transition-colors ${compactMode ? 'bg-nhs-blue' : 'bg-gray-300 dark:bg-gray-600'}`}
                                        >
                                            <div className={`absolute top-1 w-6 h-6 bg-white rounded-full transition-transform ${compactMode ? 'translate-x-7' : 'translate-x-1'}`}></div>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Notifications Section */}
                            <div className="glass dark:glass-dark rounded-2xl p-6 shadow-premium">
                                <h3 className="text-lg font-bold text-gray-800 dark:text-white mb-4 flex items-center gap-2">
                                    <span>🔔</span> Notifications
                                </h3>

                                <div className="space-y-4">
                                    <div className="flex items-center justify-between">
                                        <div className="text-sm font-medium text-gray-700 dark:text-gray-300">Task Assignments</div>
                                        <button
                                            onClick={() => setNotifTasks(!notifTasks)}
                                            className={`relative w-14 h-8 rounded-full transition-colors ${notifTasks ? 'bg-nhs-blue' : 'bg-gray-300 dark:bg-gray-600'}`}
                                        >
                                            <div className={`absolute top-1 w-6 h-6 bg-white rounded-full transition-transform ${notifTasks ? 'translate-x-7' : 'translate-x-1'}`}></div>
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-between">
                                        <div className="text-sm font-medium text-gray-700 dark:text-gray-300">New Messages</div>
                                        <button
                                            onClick={() => setNotifMessages(!notifMessages)}
                                            className={`relative w-14 h-8 rounded-full transition-colors ${notifMessages ? 'bg-nhs-blue' : 'bg-gray-300 dark:bg-gray-600'}`}
                                        >
                                            <div className={`absolute top-1 w-6 h-6 bg-white rounded-full transition-transform ${notifMessages ? 'translate-x-7' : 'translate-x-1'}`}></div>
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-between">
                                        <div className="text-sm font-medium text-gray-700 dark:text-gray-300">Handover Notes</div>
                                        <button
                                            onClick={() => setNotifHandovers(!notifHandovers)}
                                            className={`relative w-14 h-8 rounded-full transition-colors ${notifHandovers ? 'bg-nhs-blue' : 'bg-gray-300 dark:bg-gray-600'}`}
                                        >
                                            <div className={`absolute top-1 w-6 h-6 bg-white rounded-full transition-transform ${notifHandovers ? 'translate-x-7' : 'translate-x-1'}`}></div>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Save Button */}
                            <button
                                onClick={handleSaveSettings}
                                className="w-full bg-nhs-blue hover:bg-blue-700 text-white py-3 rounded-lg font-medium transition-colors"
                            >
                                💾 Save Changes
                            </button>
                        </div>
                    </div>
                );
            }

            // Staff management view (admin only)
            return (
                <div className="p-4 max-w-4xl mx-auto pb-24">
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-2xl font-bold text-gray-800 dark:text-white">Team</h2>
                        <button
                            onClick={() => setShowSettings(true)}
                            className="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white px-4 py-2 rounded-lg font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors flex items-center gap-2"
                        >
                            <span>⚙️</span> Settings
                        </button>
                    </div>

                    {isAdmin && pendingRequests.length > 0 && (
                        <div className="mb-6">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="font-semibold text-gray-800 dark:text-white">Pending Requests ({pendingRequests.length})</h3>
                                <button onClick={() => setShowApproval(!showApproval)} className="text-blue-600 dark:text-blue-400 text-sm">
                                    {showApproval ? 'Hide' : 'Show'}
                                </button>
                            </div>

                            {showApproval && (
                                <div className="space-y-3">
                                    {pendingRequests.map(request => (
                                        <div key={request.userId} className="glass dark:glass-dark rounded-xl p-4 shadow-premium">
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <div className="font-semibold text-gray-800 dark:text-white">{request.userName}</div>
                                                    <div className="text-sm text-gray-600 dark:text-gray-400">{request.userEmail}</div>
                                                    <div className="text-xs text-gray-500 dark:text-gray-500 mt-1">
                                                        Requested: {request.requestedRole} • {new Date(request.requestedAt).toLocaleDateString()}
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => handleApprove(request.userId)} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm">
                                                        ✓ Approve
                                                    </button>
                                                    <button onClick={() => handleReject(request.userId)} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm">
                                                        ✕ Reject
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    <div className="space-y-4">
                        {currentBranch?.members?.map(member => {
                            const memberUser = users.find(u => u.id === member.userId);
                            if (!memberUser) return null;

                            return (
                                <div key={member.userId} className="glass dark:glass-dark rounded-xl p-5 shadow-premium hover-lift">
                                    <div className="flex items-center gap-4">
                                        <img src={memberUser.profilePicture} alt={memberUser.name} className="w-16 h-16 rounded-full ring-4 ring-white dark:ring-gray-700" />
                                        <div className="flex-1">
                                            <div className="font-semibold text-lg text-gray-800 dark:text-white">{memberUser.name}</div>
                                            <div className="text-sm text-gray-600 dark:text-gray-400 capitalize">{member.role.replace('-', ' ')}</div>
                                            <div className="text-xs text-gray-500 dark:text-gray-500 mt-1">
                                                Joined {new Date(member.joinedAt).toLocaleDateString()}
                                            </div>
                                        </div>
                                        {isAdmin && member.userId !== user.id && (
                                            <button
                                                onClick={() => handleRemoveMember(member.userId)}
                                                className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm transition-colors"
                                            >
                                                Remove
                                            </button>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ============= RENDER APP =============
        ReactDOM.render(<PharmacyApp />, document.getElementById('root'));
    </script>
</body>
</html>
